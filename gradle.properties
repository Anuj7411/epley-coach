android.useAndroidX=true
# AGP 9.x defaults to the new Variant DSL. Opting out keeps the classic, well-documented
# build syntax; revisit before AGP 10, where the new DSL becomes mandatory.
android.newDsl.optOut=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
