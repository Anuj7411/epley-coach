# validateDistributionUrl is off deliberately. It is a pre-download reachability check on the
# distribution URL, not a TLS or integrity control: the download stays over HTTPS with normal
# certificate verification, and distributionSha256Sum below pins the exact bytes, so a tampered
# or substituted archive is rejected either way. The check itself makes a HEAD request that
# follows services.gradle.org -> github.com -> release-assets.githubusercontent.com, and that
# last hop times out on a JVM that prefers IPv6, which turns the check into a hang rather than
# a safeguard. Leaving it on would break ./gradlew without protecting anything.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=60000
retries=3
retryBackOffMs=500
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
