# networkTimeout and retries are raised from the 10s/0 defaults. This connection has slow
# patches: the first attempt at this 144 MB download died at 91 percent and, with retries=0,
# simply gave up, and a git push failed the same way a few minutes later. 10 seconds is not
# enough headroom to ride one out. distributionSha256Sum pins the exact bytes, so a download
# that is resumed, retried or tampered with is still checked before it is used.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=60000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
